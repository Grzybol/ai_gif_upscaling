[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midnight-upscale"
version = "0.1.0"
description = "Local GIF-to-transparent-WebM upscaling pipeline for Midnight Lounge character assets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
gui = [
    "gradio>=5.9",
]
bgremove = [
    "rembg>=2.0.57",
    "onnxruntime>=1.17",
]

[project.scripts]
midnight-upscale = "midnight_upscale.cli:main"
midnight-upscale-gui = "midnight_upscale.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
